<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resend Verification | Oh My Gracious</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><main class="simple-auth-card"><a class="brand-mark dark" href="index.html">OH MY GRACIOUS</a><h1>Resend verification</h1><p class="muted">Enter the email used during registration.</p><div id="message" class="alert hidden"></div><label>Email</label><input id="email" type="email"><button id="send" class="btn primary full">Send verification link</button><p class="auth-switch"><a href="login.html">← Back to Sign In</a></p></main><script>let csrf='';fetch('backend/public-config.php').then(r=>r.json()).then(d=>csrf=d.csrf_token);document.getElementById('send').onclick=async()=>{const f=new FormData();f.append('csrf_token',csrf);f.append('email',document.getElementById('email').value);const r=await fetch('backend/resend-verification.php',{method:'POST',body:f});const d=await r.json();const m=document.getElementById('message');m.className='alert '+d.status;m.innerHTML=d.message+(d.verification_url?' <a href="'+d.verification_url+'">Open local verification link</a>':'');};</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login / Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-box">
      <h2 id="formTitle">User Login</h2>

      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">

        <button onclick="userLogin()" class="btn full">Login</button>

        <p class="switch-text">
          Don't have an account?
          <span onclick="showRegister()">Register</span>
        </p>
      </div>

      <div id="registerForm" class="hidden">
        <input type="text" id="registerFullName" placeholder="Full Name">
        <input type="email" id="registerEmail" placeholder="Email">
        <input type="password" id="registerPassword" placeholder="Password">

        <p class="password-rule">
          Password must have at least 8 characters, 1 uppercase letter,
          1 lowercase letter, 1 number, and 1 special character.
        </p>

        <button onclick="registerUser()" class="btn full secondary">Register</button>

        <p class="switch-text">
          Already have an account?
          <span onclick="showLogin()">Login</span>
        </p>
      </div>

      <hr>

      <p>Are you an admin?</p>
      <a href="admin-login.html" class="admin-link">Admin Login</a>

      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
